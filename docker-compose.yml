version: '3.8'

services:

  mysql:
    image: mysql:8.0
    container_name: oms-mysql
    environment:
      MYSQL_ROOT_PASSWORD: Password1
      MYSQL_DATABASE: ordermanagementsystem
    ports:
      - "3308:3306"
      - "5006:5005"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - oms-net
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 10

  inventory-service:
    container_name: inventory-service
    build: .
    ports:
      - "8083:8083"
      - "5005:5005"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ordermanagementsystem
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Password1
    depends_on:
     mysql:
        condition: service_healthy
    networks:
        - oms-net

networks:
  oms-net:
    external: true

volumes:
  mysql_data:
